# Rendered by the nginx image's envsubst step at container start
# (copied to /etc/nginx/templates/default.conf.template).
# ${API_ORIGIN} / ${API_WS_ORIGIN} are the backend's https:// and wss:// origins.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/conf.d/security-headers.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header in a location replaces the server-level headers, so repeat them
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
